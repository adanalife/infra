# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Three settings are repeated on every entry below, since Dependabot has no
  # place to state a default once:
  #
  #   cooldown        holds a new release for 7 days before it becomes a PR, so
  #                   a release that gets yanked or immediately patched never
  #                   costs a review. A major waits 14 -- but only where the
  #                   ecosystem has a SemVer model: Dependabot rejects the
  #                   semver-* keys for github-actions and terraform, so those
  #                   carry the flat 7. The asymmetry is required, not an
  #                   oversight.
  #                   Dependabot already applies 3 days by default; this widens
  #                   it. Security updates ignore cooldown entirely, so nothing
  #                   urgent waits.
  #   rebase-strategy is disabled. The default rebases every open bump PR
  #                   whenever main moves and re-runs all of their checks, which
  #                   costs far more CI than it saves; no ruleset here needs
  #                   a branch to be up to date before merging.
  #   schedule        is weekly on Monday 13:00 UTC, so a week's bumps arrive as
  #                   one batch to review rather than trickling in daily. The
  #                   two cdk8s entries run quarterly instead: jsii auto-releases
  #                   both halves of that toolchain on nearly every upstream
  #                   change -- 33 cdk8s and 46 cdk8s-cli patches in the three
  #                   months to 2026-09, all inside one minor, since each cuts a
  #                   minor about once a year. A weekly run turns that steady
  #                   stream into a weekly PR whatever the cooldown is set to,
  #                   because there is always a newly-eligible patch; running
  #                   quarterly is what collapses it to one PR carrying the same
  #                   end state. Security updates run on their own cadence, so
  #                   they still arrive within the day.
  #
  # Every ecosystem but helm batches into one PR per run, majors included, and a second
  # group per ecosystem catches security updates, which Dependabot otherwise
  # opens one PR per advisory on whatever day it lands. Each solo PR costs a
  # full CI run and touches the same lockfile as its siblings, so the first
  # merge leaves the rest conflicting -- and rebase-strategy is disabled, so
  # nothing repairs them. A red group is bisected by hand; that is cheaper
  # than the queue of single-bump PRs it replaces.
  # The composite actions under .github/actions/ pin actions of their own, which
  # a scan of `/` alone never sees.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
    groups:
      actions:
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    cooldown:
      default-days: 7
    rebase-strategy: disabled
  # Providers group per directory, never across them: the review here is reading
  # a plan against real infrastructure, so one PR per environment keeps a
  # surprising diff attributable to one env's state and keeps a prod-1 plan from
  # riding along with a core one. The group name carries the env so the PR title
  # says which plan it is.
  #
  # A provider major joins its directory's group like any other bump; the
  # per-environment split is what keeps it attributable to one plan.
  - package-ecosystem: terraform
    directory: terraform/core
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
    groups:
      core-providers:
        patterns:
          - "*"
      core-providers-security:
        applies-to: security-updates
        patterns:
          - "*"
    cooldown:
      default-days: 7
    rebase-strategy: disabled
  - package-ecosystem: terraform
    directory: terraform/stage-1
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
    groups:
      stage-1-providers:
        patterns:
          - "*"
      stage-1-providers-security:
        applies-to: security-updates
        patterns:
          - "*"
    cooldown:
      default-days: 7
    rebase-strategy: disabled
  - package-ecosystem: terraform
    directory: terraform/prod-1
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
    groups:
      prod-1-providers:
        patterns:
          - "*"
      prod-1-providers-security:
        applies-to: security-updates
        patterns:
          - "*"
    cooldown:
      default-days: 7
    rebase-strategy: disabled
  # The platform workspace holds the org's GitHub App wiring, so a provider bump
  # here moves repo and secret resources rather than infrastructure -- its plan
  # wants a closer read than the environment directories' do.
  - package-ecosystem: terraform
    directory: terraform/platform
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
    groups:
      platform-providers:
        patterns:
          - "*"
      platform-providers-security:
        applies-to: security-updates
        patterns:
          - "*"
    cooldown:
      default-days: 7
    rebase-strategy: disabled
  - package-ecosystem: terraform
    directory: terraform/prod-1-data
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
    groups:
      prod-1-data-providers:
        patterns:
          - "*"
      prod-1-data-providers-security:
        applies-to: security-updates
        patterns:
          - "*"
    cooldown:
      default-days: 7
    rebase-strategy: disabled
  # The platform Helm charts. Their pins live in a Chart.yaml that nothing
  # installs, because Chart.yaml dependencies are what this ecosystem reads;
  # the cdk8s layer loads its version table from the same file. The directory
  # holds that one file so no values.yml is scanned for image tags.
  # Cooldown is the flat 7: this ecosystem ignores the semver-* keys.
  # A bump moves a targetRevision in cdk8s/dist/, and a Dependabot run cannot
  # push the re-synth, so cdk8s-synth is red on the PR until `task cdk8s:synth`
  # is committed to the branch.
  - package-ecosystem: helm
    directory: cdk8s/platform-charts
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
    # One PR per chart, unlike every other entry here: each chart is its own
    # rollout with its own release notes to read, and the bumps touch separate
    # lines, so one merging does not conflict the rest. The limit is raised
    # from the default 5 so every stale chart is visible at once. The two ARC
    # charts are the exception -- controller and runner set must run the same
    # version.
    open-pull-requests-limit: 20
    groups:
      arc:
        patterns:
          - "gha-runner-scale-set*"
    cooldown:
      default-days: 7
    rebase-strategy: disabled
  # The cdk8s CLI and its jsii toolchain. Dependabot has no mise backend, so
  # this is only reachable because the CLI is pinned in package-lock.json
  # rather than cdk8s/.mise.toml. cdk8s-synth re-synths on the bump PR, so a
  # codegen change that would move dist/ fails the PR instead of main.
  # Direct dependencies only: the point of the lockfile is that cdk8s-cli's
  # transitive tree moves when the CLI moves, so a lone transitive bump is
  # churn against a pin that is deliberate.
  - package-ecosystem: npm
    directory: cdk8s
    schedule:
      interval: quarterly
      day: monday
      time: "13:00"
    groups:
      cdk8s:
        patterns:
          - "*"
      cdk8s-security:
        applies-to: security-updates
        patterns:
          - "*"
    cooldown:
      default-days: 7
      semver-major-days: 14
    rebase-strategy: disabled
    allow:
      - dependency-type: direct
  # The cdk8s Python layer: the libraries the authoring code imports. The npm
  # entry above covers the CLI half of the same toolchain; without this one the
  # Python half takes no updates at all, security included.
  - package-ecosystem: uv
    directory: cdk8s
    schedule:
      interval: quarterly
      day: monday
      time: "13:00"
    groups:
      python:
        patterns:
          - "*"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
    cooldown:
      default-days: 7
      semver-major-days: 14
    rebase-strategy: disabled
