# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: terraform
    directory: terraform/core
    schedule:
      interval: daily
  - package-ecosystem: terraform
    directory: terraform/stage-1
    schedule:
      interval: daily
  - package-ecosystem: terraform
    directory: terraform/prod-1
    schedule:
      interval: daily
  # The cdk8s CLI and its jsii toolchain. Dependabot has no mise backend, so
  # this is only reachable because the CLI is pinned in package-lock.json
  # rather than cdk8s/.mise.toml. cdk8s-synth re-synths on the bump PR, so a
  # codegen change that would move dist/ fails the PR instead of main.
  - package-ecosystem: npm
    directory: cdk8s
    schedule:
      interval: daily
