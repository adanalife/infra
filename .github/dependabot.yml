# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Three settings are repeated on every entry below, since Dependabot has no
  # place to state a default once:
  #
  #   cooldown        holds a new release for 7 days before it becomes a PR, so
  #                   a release that gets yanked or immediately patched never
  #                   costs a review. A major waits 14 -- but only where the
  #                   ecosystem has a SemVer model: Dependabot rejects the
  #                   semver-* keys for github-actions and terraform, so those
  #                   carry the flat 7. The asymmetry is required, not an
  #                   oversight.
  #                   Dependabot already applies 3 days by default; this widens
  #                   it. Security updates ignore cooldown entirely, so nothing
  #                   urgent waits.
  #   rebase-strategy is disabled. The default rebases every open bump PR
  #                   whenever main moves and re-runs all of their checks, which
  #                   costs far more CI than it saves; no ruleset here needs
  #                   a branch to be up to date before merging.
  #   schedule        is weekly on Monday 13:00 UTC, so a week's bumps arrive as
  #                   one batch to review rather than trickling in daily.
  #
  # Minor and patch bumps batch into one PR per run; a major is left out of
  # every non-Actions group so it arrives on its own, where a breaking change is
  # attributable to a single dependency instead of hiding among a dozen safe
  # ones. Security updates ignore `groups` entirely and always arrive alone.
  #
  # The Actions group takes majors too, unlike the others. An action major is
  # normally a runner or Node version bump rather than an API break, so the
  # attributability that keeps majors solo elsewhere buys little here — and
  # holding them out produced a standing queue of one-line PRs nobody merged.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    rebase-strategy: disabled
  # Providers group per directory, never across them: the review here is reading
  # a plan against real infrastructure, so one PR per environment keeps a
  # surprising diff attributable to one env's state and keeps a prod-1 plan from
  # riding along with a core one. The group name carries the env so the PR title
  # says which plan it is.
  #
  # Majors stay ungrouped: a provider major can rewrite a plan wholesale, and
  # that review wants a single dependency in front of it.
  - package-ecosystem: terraform
    directory: terraform/core
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
    groups:
      core-providers:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
    rebase-strategy: disabled
  - package-ecosystem: terraform
    directory: terraform/stage-1
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
    groups:
      stage-1-providers:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
    rebase-strategy: disabled
  - package-ecosystem: terraform
    directory: terraform/prod-1
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
    groups:
      prod-1-providers:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
    rebase-strategy: disabled
  # The platform workspace holds the org's GitHub App wiring, so a provider bump
  # here moves repo and secret resources rather than infrastructure -- its plan
  # wants a closer read than the environment directories' do.
  - package-ecosystem: terraform
    directory: terraform/platform
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
    groups:
      platform-providers:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
    rebase-strategy: disabled
  # The cdk8s CLI and its jsii toolchain. Dependabot has no mise backend, so
  # this is only reachable because the CLI is pinned in package-lock.json
  # rather than cdk8s/.mise.toml. cdk8s-synth re-synths on the bump PR, so a
  # codegen change that would move dist/ fails the PR instead of main.
  # Direct dependencies only: the point of the lockfile is that cdk8s-cli's
  # transitive tree moves when the CLI moves, so a lone transitive bump is
  # churn against a pin that is deliberate.
  - package-ecosystem: npm
    directory: cdk8s
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
    groups:
      cdk8s:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
      semver-major-days: 14
    rebase-strategy: disabled
    allow:
      - dependency-type: direct
  # The cdk8s Python layer: the libraries the authoring code imports. The npm
  # entry above covers the CLI half of the same toolchain; without this one the
  # Python half takes no updates at all, security included.
  - package-ecosystem: uv
    directory: cdk8s
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
    groups:
      python:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
      semver-major-days: 14
    rebase-strategy: disabled
