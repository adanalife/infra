# The fleet's pre-commit job, as one reusable workflow. Each repo's
# pre-commit.yml calls this, so a hook-runner fix lands once instead of in
# every copy.
#
# Two ways to run pre-commit, picked by the runner:
#
# - Self-hosted (`arc-*`): the repo's mise pins install pre-commit itself, and
#   it runs directly rather than through pre-commit/action. That action bundles
#   an actions/cache of ~/.cache/pre-commit, which on this pool is pure
#   duplication — k8s/arc/runners/values.yml mounts ~/.cache as a hostPath
#   shared across runner pods, so the hook envs are already there. Actions
#   cache is branch-scoped, so the action would upload a ~600MB copy per PR and
#   fill each private repo's 10GB quota with byte-identical duplicates,
#   evicting the caches that do earn their keep.
# - GitHub-hosted: every job starts empty, so pre-commit/action's cache of the
#   hook envs is what keeps the job fast.
name: hooks

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label.
        type: string
        default: arc-amd64
      skip:
        description: Extra hook ids to skip, comma-separated (`no-commit-to-branch` is always skipped).
        type: string
        default: ""
      mise:
        description: Install the repo's mise pins (the toolchains the hooks shell out to). On the self-hosted pool this is also where pre-commit comes from, so leave it on there.
        type: boolean
        default: true
      rust:
        description: Restore the repo-pinned Rust toolchain from the Actions cache and add rustfmt, for a cargo-fmt hook. Installs the mise pins too.
        type: boolean
        default: false
      terraform:
        description: Put terraform on PATH for a terraform_fmt hook, for a repo whose mise pins deliberately leave it out.
        type: boolean
        default: false
      setup:
        description: The repo's own setup commands, one per line, run after the toolchains — a system package a hook needs, say.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    env:
      SKIP: ${{ inputs.skip && format('no-commit-to-branch,{0}', inputs.skip) || 'no-commit-to-branch' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Both install the repo's mise pins; the Rust one restores the toolchain
      # from the Actions cache first.
      - if: inputs.rust
        uses: adanalife/infra/.github/actions/rust-toolchain@main
      - if: ${{ inputs.mise && !inputs.rust }}
        uses: jdx/mise-action@v4

      - if: inputs.terraform
        uses: hashicorp/setup-terraform@v4

      - name: Repo setup
        if: inputs.setup != ''
        env:
          SETUP: ${{ inputs.setup }}
        run: bash -euo pipefail -c "${SETUP}"

      # no-commit-to-branch (skipped via SKIP above) guards local commits; in
      # CI the checkout is the branch itself, so the hook would false-positive
      # on main.
      - if: startsWith(inputs.runs-on, 'arc-')
        run: pre-commit run --show-diff-on-failure --color=always --all-files

      # pre-commit/action pip-installs into whichever python is first on PATH.
      # Without this step that can be mise's python, whose script dir only
      # resolves through a symlink the mise-action cache flattens — so
      # restored-cache runs can't find the pre-commit binary. setup-python's
      # interpreter takes PATH precedence and its script dir is always on PATH.
      # The explicit version matters: without one setup-python installs nothing
      # and defers to the python already on PATH.
      - if: ${{ !startsWith(inputs.runs-on, 'arc-') }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - if: ${{ !startsWith(inputs.runs-on, 'arc-') }}
        uses: pre-commit/action@v3.0.1
