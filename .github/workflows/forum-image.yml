# Builds the forum image (cdk8s constructs/forum.py) from the upstream
# project's own Dockerfile at a pinned commit. Upstream publishes no public image.
#
# To upgrade the forum: bump UPSTREAM_REF here and IMAGE's tag in constructs/forum.py
# together (a cdk8s unit test holds them equal). The container migrates its
# databases on start.
name: forum-image

on:
  # A PR touching this file builds without pushing, so a bad ref or a changed
  # upstream Dockerfile fails here rather than on main.
  pull_request:
    paths:
      - .github/workflows/forum-image.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/forum-image.yml
  workflow_dispatch:

concurrency:
  group: forum-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_REF: 864b251083ba38cf5cc8af10b0189facd257c816

jobs:
  build:
    # GitHub-hosted: the arc-amd64 pool has no Docker daemon.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          repository: b3s/b3s
          ref: ${{ env.UPSTREAM_REF }}
          persist-credentials: false

      # Upstream's Dockerfile pulls its bases and its syntax frontend from
      # Docker Hub, which CI here never does. ECR Public carries the same
      # official images, and BuildKit's built-in frontend needs no pull. These
      # two bases are not in the GHCR mirror set; ECR Public spares adding them.
      - name: Point the base images away from Docker Hub
        run: |
          set -euo pipefail
          sed -i -e '/^# syntax=/d' \
            -e 's|docker\.io/library/|public.ecr.aws/docker/library/|' Dockerfile
          grep -n '^FROM' Dockerfile
          ! grep -n 'docker\.io' Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          # The minipc is amd64 and nothing else runs this.
          platforms: linux/amd64
          tags: ghcr.io/adanalife/forum:${{ env.UPSTREAM_REF }}
          push: ${{ github.event_name != 'pull_request' }}
