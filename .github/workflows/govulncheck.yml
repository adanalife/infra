name: govulncheck

# Go vulnerability scan of a module's call graph, against the Go version the
# module is built with. Each Go repo's govulncheck.yml calls this.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      # No outer checkout — the action does its own checkout + setup-go (an
      # outer actions/checkout leaves credentials around that collide with the
      # action's pinned checkout, yielding a duplicate-Authorization 400 on
      # fetch).
      - uses: golang/govulncheck-action@v1
        env:
          # Go's default GOPATH is $HOME/go, which setup-go cannot create on
          # the self-hosted runner image — $HOME is not writable there. The
          # job's temp dir is writable everywhere.
          GOPATH: ${{ runner.temp }}/go
        with:
          # go-version-input defaults to 'stable' and the action hands both it
          # and go-version-file to setup-go, which prefers go-version. Left at
          # the default, go-version-file is dead and the scan runs on whatever
          # is newest -- so every stdlib fix between our pin and current stable
          # reads as already-fixed. Blanking it restores go.mod as the source
          # of truth, which is the toolchain the binaries are actually built
          # with.
          go-version-input: ''
          go-version-file: go.mod
