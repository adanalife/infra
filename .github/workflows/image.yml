# Builds one linux/amd64 image and pushes it to GHCR under the org — the
# floating :main image a private repo's dev-image.yml publishes on every main
# push, which stage-1 deploys (imagePullPolicy: Always picks up rebuilds under
# the tag).
#
# linux/amd64 only: stage-1 is the amd64 minipc, and this fires on every merge,
# so an emulated arm64 leg would roughly double the longest job in CI for an
# image no cluster node pulls. The arm64 k3d dev cluster builds its images
# locally instead.
#
# The caller owns concurrency: a dev-image caller cancels a superseded main
# build so an older run finishing last can't clobber :main with a stale image.
#
# A caller that passes DISCORD_WEBHOOK_ALERTS gets a Discord alert when the
# build fails.
name: image

on:
  workflow_call:
    inputs:
      image:
        description: Package name under ghcr.io/adanalife, e.g. `tripbot-console`.
        required: true
        type: string
      context:
        description: Docker build context.
        type: string
        default: .
      tags:
        description: Tags to push, whitespace-separated.
        type: string
        default: main
      sha-tag:
        description: Also push an immutable `sha-<short sha>` tag, for pinning a rollout to a commit.
        type: boolean
        default: false
      build-args:
        description: Docker build args, one `KEY=value` per line.
        type: string
        default: ""
    secrets:
      DISCORD_WEBHOOK_ALERTS:
        description: Where a failed build is reported. A failed :main build otherwise says nothing — whatever deploys :main keeps pulling the previous commit.
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    # GitHub-hosted, not the arc-amd64 pool: `docker build` layer writes land on
    # the minipc's /var, the volume etcd fsyncs to, and a burst there stalls etcd
    # past its lease deadline, dropping every leader election in the cluster. The
    # runner chart hardcodes dind's volumeMounts, so its data-root can't be moved
    # off /var from config — keeping the build off the pool is the lever.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Image refs
        id: refs
        env:
          IMAGE: ghcr.io/adanalife/${{ inputs.image }}
          TAGS: ${{ inputs.tags }}
          SHA_TAG: ${{ inputs.sha-tag }}
        run: |
          {
            echo 'tags<<EOF'
            for t in $TAGS; do echo "$IMAGE:$t"; done
            [ "$SHA_TAG" = true ] && echo "$IMAGE:sha-${GITHUB_SHA::7}"
            echo 'EOF'
            echo "cache=$IMAGE:buildcache"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN pushes packages in its own repo, so no extra secret.
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v7
        # The build record is an Actions artifact billed against the org storage
        # quota; the default 90-day retention fills it.
        env:
          DOCKER_BUILD_RECORD_RETENTION_DAYS: 7
        with:
          context: ${{ inputs.context }}
          platforms: linux/amd64
          tags: ${{ steps.refs.outputs.tags }}
          push: true
          build-args: ${{ inputs.build-args }}
          # Layer cache in the image's own GHCR repo. The runner starts with an
          # empty daemon every job, so the cache has to live off-box; a registry
          # cache pulls the layers it needs from the registry the build already
          # authenticates to and pushes to.
          cache-from: type=registry,ref=${{ steps.refs.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.refs.outputs.cache }},mode=max

  # A failed build leaves :main frozen on the previous commit and says nothing:
  # the environment that pulls it keeps running the code it was built from, and
  # the only tell is a deploy behaving like an older commit. Points at the log
  # rather than naming a cause — a lost packages grant, a base-image tag that
  # moved, and a genuine build break all arrive here identically.
  #
  # A private caller alerts from arc-amd64: when an Actions budget stops GitHub
  # starting its hosted build, the build job reports `failure` with no steps,
  # and an alert on the hosted pool is refused the same way. A public caller
  # stays hosted — its minutes are free, and the org's runner group excludes
  # public repos.
  alert:
    needs: [build]
    if: failure()
    runs-on: ${{ github.event.repository.private && 'arc-amd64' || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
    steps:
      # curl rather than Ilshidur/action-discord: that is a Docker container
      # action, and the arc-amd64 pool has no Docker daemon. Both pools carry
      # curl and jq.
      - name: Alert Discord on failure
        if: env.DISCORD_WEBHOOK != ''
        continue-on-error: true
        env:
          REPO: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          jq -n --arg c "Dev image :main failed to rebuild for [${REPO}](${REPO_URL}) — whatever deploys :main still pulls the previous commit: [run log](${RUN_URL})" '{content: $c}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$DISCORD_WEBHOOK"
