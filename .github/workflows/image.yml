# Builds one linux/amd64 image and pushes it to GHCR under the org — the
# floating :main image a private repo's dev-image.yml publishes on every main
# push, which stage-1 deploys (imagePullPolicy: Always picks up rebuilds under
# the tag).
#
# linux/amd64 only: stage-1 is the amd64 minipc, and this fires on every merge,
# so an emulated arm64 leg would roughly double the longest job in CI for an
# image no cluster node pulls. The arm64 k3d dev cluster builds its images
# locally instead.
#
# The caller owns concurrency: a dev-image caller cancels a superseded main
# build so an older run finishing last can't clobber :main with a stale image.
name: image

on:
  workflow_call:
    inputs:
      image:
        description: Package name under ghcr.io/adanalife, e.g. `tripbot-console`.
        required: true
        type: string
      context:
        description: Docker build context.
        type: string
        default: .
      tags:
        description: Tags to push, whitespace-separated.
        type: string
        default: main
      sha-tag:
        description: Also push an immutable `sha-<short sha>` tag, for pinning a rollout to a commit.
        type: boolean
        default: false
      build-args:
        description: Docker build args, one `KEY=value` per line.
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    # GitHub-hosted, not the arc-amd64 pool: `docker build` layer writes land on
    # the minipc's /var, the volume etcd fsyncs to, and a burst there stalls etcd
    # past its lease deadline, dropping every leader election in the cluster. The
    # runner chart hardcodes dind's volumeMounts, so its data-root can't be moved
    # off /var from config — keeping the build off the pool is the lever.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Image refs
        id: refs
        env:
          IMAGE: ghcr.io/adanalife/${{ inputs.image }}
          TAGS: ${{ inputs.tags }}
          SHA_TAG: ${{ inputs.sha-tag }}
        run: |
          {
            echo 'tags<<EOF'
            for t in $TAGS; do echo "$IMAGE:$t"; done
            [ "$SHA_TAG" = true ] && echo "$IMAGE:sha-${GITHUB_SHA::7}"
            echo 'EOF'
            echo "cache=$IMAGE:buildcache"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN pushes packages in its own repo, so no extra secret.
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          platforms: linux/amd64
          tags: ${{ steps.refs.outputs.tags }}
          push: true
          build-args: ${{ inputs.build-args }}
          # Layer cache in the image's own GHCR repo. The runner starts with an
          # empty daemon every job, so the cache has to live off-box; a registry
          # cache pulls the layers it needs from the registry the build already
          # authenticates to and pushes to.
          cache-from: type=registry,ref=${{ steps.refs.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.refs.outputs.cache }},mode=max
