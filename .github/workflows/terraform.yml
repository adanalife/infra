name: terraform

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  # GCP Workload Identity Federation (stage-1 / prod-1 google provider auth)
  id-token: write

jobs:
  plan:
    # Dependabot PRs run with an isolated, empty secret namespace; skip the
    # AWS-touching plan job for them. validate + fmt still run.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Don't let one workspace's failing plan cancel the others — notably
      # terraform/platform, whose plan stays red until the GitHub App
      # bootstrap seeds the SM key.
      fail-fast: false
      matrix:
        terraform-dirs:
          - terraform/core
          - terraform/platform
          - terraform/stage-1
          - terraform/prod-1
          - terraform/prod-1-data
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - run: ./.github/scripts/set-deploy-env.sh ${{ matrix.terraform-dirs }}
        env:
          CI_CORE_AWS_ACCESS_KEY_ID: ${{ secrets.CI_CORE_AWS_ACCESS_KEY_ID }}
          CI_CORE_AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CORE_AWS_SECRET_ACCESS_KEY }}
          CI_PROD_AWS_ACCESS_KEY_ID: ${{ secrets.CI_PROD_AWS_ACCESS_KEY_ID }}
          CI_PROD_AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_PROD_AWS_SECRET_ACCESS_KEY }}
          CI_STAGE_AWS_ACCESS_KEY_ID: ${{ secrets.CI_STAGE_AWS_ACCESS_KEY_ID }}
          CI_STAGE_AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_STAGE_AWS_SECRET_ACCESS_KEY }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: CITerraformRole
      # stage-1 / prod-1 carry a google provider that authenticates keyless via
      # Workload Identity Federation (GitHub OIDC -> the per-project terraform
      # SA). Resolve the per-env WIF provider + SA, then mint a short-lived SA
      # access token the google provider reads (GOOGLE_OAUTH_ACCESS_TOKEN) — this
      # is an env var, so it reaches the dflook container action (a creds *file*
      # would not). gcp_impersonate=false: CI is already the SA, no further hop.
      - name: GCP WIF target
        if: matrix.terraform-dirs == 'terraform/stage-1' || matrix.terraform-dirs == 'terraform/prod-1'
        run: |
          case "${{ matrix.terraform-dirs }}" in
            terraform/prod-1)
              echo "WIF_PROVIDER=projects/876608406330/locations/global/workloadIdentityPools/github/providers/github" >> "$GITHUB_ENV"
              echo "WIF_SA=terraform@tripbot-prod.iam.gserviceaccount.com" >> "$GITHUB_ENV" ;;
            terraform/stage-1)
              echo "WIF_PROVIDER=projects/574760983858/locations/global/workloadIdentityPools/github/providers/github" >> "$GITHUB_ENV"
              echo "WIF_SA=terraform@tripbot-stage.iam.gserviceaccount.com" >> "$GITHUB_ENV" ;;
          esac
          echo "TF_VAR_gcp_impersonate=false" >> "$GITHUB_ENV"
      - name: GCP auth (WIF)
        id: gcp_auth
        if: matrix.terraform-dirs == 'terraform/stage-1' || matrix.terraform-dirs == 'terraform/prod-1'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}
          token_format: access_token
      - name: Export GCP token for terraform
        if: steps.gcp_auth.outcome == 'success'
        run: echo "GOOGLE_OAUTH_ACCESS_TOKEN=${{ steps.gcp_auth.outputs.access_token }}" >> "$GITHUB_ENV"
      # The per-dir comment is off; the `comment` job posts one comment for
      # the whole matrix, built from the summary each leg uploads below.
      - name: terraform plan
        id: plan
        uses: dflook/terraform-plan@v3
        with:
          path: ${{ matrix.terraform-dirs }}
          add_github_comment: false
      - name: Summarize plan
        if: always()
        env:
          DIR: ${{ matrix.terraform-dirs }}
          OUTCOME: ${{ steps.plan.outcome }}
          CHANGES: ${{ steps.plan.outputs.changes }}
          TEXT_PLAN: ${{ steps.plan.outputs.text_plan_path }}
          COUNTS: "${{ steps.plan.outputs.to_add }} to add, ${{ steps.plan.outputs.to_change }} to change, ${{ steps.plan.outputs.to_destroy }} to destroy"
        run: |
          mkdir -p plan-summary
          echo "$DIR" > plan-summary/dir
          if [ "$OUTCOME" != success ]; then
            echo failed > plan-summary/status
          elif [ "$CHANGES" = true ]; then
            echo changes > plan-summary/status
            echo "$COUNTS" > plan-summary/counts
            # ponytail: fixed per-plan cap keeps five dirty plans under GitHub's 65536-char comment limit
            head -c 12000 "$TEXT_PLAN" > plan-summary/plan.txt
            if [ "$(wc -c < "$TEXT_PLAN")" -gt 12000 ]; then
              printf '\n... truncated; the full plan is in the run log\n' >> plan-summary/plan.txt
            fi
          else
            echo clean > plan-summary/status
          fi
      - name: Upload plan summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plan-${{ strategy.job-index }}
          path: plan-summary/
          retention-days: 1

  comment:
    # One sticky PR comment for the whole plan matrix: a section per workspace
    # with changes or a failed plan, and one line naming the clean ones.
    needs: plan
    if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: plan-*
          path: plans
      - name: Build comment
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          clean=()
          dirty=0
          {
            echo "### terraform plan"
            for d in plans/*/; do
              dir=$(cat "$d/dir")
              case $(cat "$d/status") in
                failed)
                  dirty=$((dirty + 1))
                  echo
                  echo ":x: **\`$dir\`: plan failed.** See the [run log]($run_url)."
                  ;;
                changes)
                  dirty=$((dirty + 1))
                  echo
                  echo "<details><summary><code>$dir</code>: $(cat "$d/counts")</summary>"
                  echo
                  echo '```hcl'
                  cat "$d/plan.txt"
                  echo '```'
                  echo
                  echo "</details>"
                  ;;
                clean)
                  clean+=("\`$dir\`")
                  ;;
              esac
            done
            echo
            if [ "$dirty" -eq 0 ] && [ "${#clean[@]}" -eq 0 ]; then
              echo "No plan results were uploaded. See the [run log]($run_url)."
            elif [ "${#clean[@]}" -gt 0 ]; then
              other=""
              [ "$dirty" -gt 0 ] && other="other "
              noun="workspaces"
              [ "${#clean[@]}" -eq 1 ] && noun="workspace"
              list=$(printf '%s, ' "${clean[@]}")
              echo "No changes in ${#clean[@]} $other$noun: ${list%, }."
            fi
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
      - uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: terraform-plan
          path: comment.md

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        terraform-dirs: [terraform/core, terraform/platform, terraform/prod-1, terraform/prod-1-data, terraform/stage-1]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: terraform validate
        uses: dflook/terraform-validate@v3
        with:
          path: ${{ matrix.terraform-dirs }}

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        terraform-dirs: [terraform/core, terraform/platform, terraform/prod-1, terraform/prod-1-data, terraform/stage-1]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: terraform fmt
        uses: dflook/terraform-fmt-check@v3
        with:
          path: ${{ matrix.terraform-dirs }}
