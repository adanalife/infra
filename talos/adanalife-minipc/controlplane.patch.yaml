# Machine config patch for adanalife-minipc (single control-plane node).
#
# Applied on top of the generated controlplane.yaml via:
#   talosctl machineconfig patch controlplane.yaml \
#     --patch @controlplane.patch.yaml \
#     --output controlplane.patched.yaml
#
# Non-secret. Safe to commit. The base controlplane.yaml (gitignored) carries
# the PKI material this patch doesn't.
#
# NIC uses DHCP. Stable IP is enforced by a DHCP reservation at the router
# (MAC 58:47:ca:7d:7b:b0 → 192.168.40.111 on the Maine network). A move needs an
# equivalent reservation on the new router; the reservation address does not have
# to be preserved, because what is baked into the generated controlplane.yaml is
# the alias endpoint https://minipc.whereisdana.today:6443, not an address. That
# alias is a CNAME onto the active location, managed in terraform/core, and it is
# carried as a machine certSAN — so repointing DNS is the whole move and no
# Talos-side regeneration is needed.
#
# Hostname is set via the HostnameConfig sub-resource (Talos 1.13+ pattern).
# Setting machine.network.hostname in v1alpha1 conflicts with HostnameConfig.
#
# KubeSpan is a creation-time feature — it takes effect on a wipe-reinstall
# (apply-config), not when patched onto the running node. Added 2026-05-20.
# Disk encryption was attempted here too but DEFERRED (see the note below — it
# needs a SecureBoot image).
#
# Cilium CNI: cluster.network.cni.name=none + cluster.proxy.disabled=true tell
# Talos to install NEITHER its default Flannel CNI NOR kube-proxy — Cilium
# replaces both (eBPF kube-proxy replacement). These are creation-time, so they
# ride this wipe. Cilium itself is installed via helm as the FIRST platform step
# (k8s:<env>:platform:up); until it's up the node stays NotReady (no CNI), so
# `talosctl health` won't go fully green until the helm install lands — expected.
#
# Tailscale: the installer schematic bakes in the siderolabs/tailscale extension
# (schematic = i915 + intel-ucode + tailscale). Its config —
# an ExtensionServiceConfig carrying the secret TS_AUTHKEY — is NOT in this
# (committed, non-secret) patch: it lives in tailscale.patch.yaml (gitignored
# plaintext) / tailscale.patch.sops.yaml (committed, SOPS-sealed), applied as an
# extra `--patch` at apply time. See tailscale.patch.yaml.example and the
# bootstrap runbook's Tailscale section. Creation-time like KubeSpan — takes
# effect on a wipe-reinstall, not a live patch.

machine:
  install:
    disk: /dev/nvme0n1
    # Schematic = i915 + intel-ucode + tailscale extensions + two kernel args,
    # usb-storage.quirks=04e8:61f5:u and netconsole (both below). There is no iSCSI in this
    # cluster — both StorageClasses are rancher.io/local-path — so
    # iscsi-tools is not in the schematic, which is also what lets
    # workloadIsolation below be safe (see the SecurityProfileConfig doc).
    # `siderolabs/i915` is the canonical name for the Intel GPU microcode +
    # kernel modules; the Factory resolves the legacy `i915-ucode` spelling
    # to the same extension, so the VAAPI path is byte-identical.
    #
    # The quirk forces the plain usb-storage driver (no UAS command queuing)
    # for the Samsung T5 (the /var/mnt/data UserVolume), which drops off the USB
    # bus under sustained UAS write load — taking the XFS filesystem and both
    # postgreses down with it. Slower sequential I/O, stable link.
    #
    # netconsole streams kernel messages straight from the kernel to the
    # Synology over UDP, which is what makes it the one instrument that can
    # record a panic: the NAS-side `talosctl dmesg --follow` capture and Talos's
    # KmsgLogConfig both ship through userspace, so a hard panic or power cut
    # leaves nothing behind — the observed shape of the 2026-08-23/24 crash run.
    # The argument is
    #   netconsole=<srcport>@<srcip>/<dev>,<dstport>@<dstip>/<dstmac>
    # so it hardcodes what the rest of this config deliberately keeps in DNS:
    # the node's LAN address, the NIC name, and the NAS's IP *and MAC* (the
    # kernel has no ARP at panic time). A location move or a NAS NIC swap
    # silently stops the capture without otherwise affecting the node — it is
    # fire-and-forget UDP, so a dead target costs nothing. Re-mint the schematic
    # when any of those three change.
    #
    # The config uses UKI (grubUseUKICmdline), so kernel args live in the
    # factory schematic, not install.extraKernelArgs — regenerate via the curl
    # block in the bootstrap runbook, and note image changes only land via
    # `talosctl upgrade`, not apply-config alone.
    image: factory.talos.dev/installer/99ced12c0e1eeb46c40e6a2e5a45abb701265bc0c808cb02ddbc0fbabf55ee39:v1.14.0
  network:
    interfaces:
      - interface: enp88s0
        dhcp: true
    # KubeSpan — WireGuard full-mesh between nodes, auto-keyed per node on first
    # boot. Dormant on this single-node cluster, but enabling it now means the
    # plumbing is tested before a second node lands (which could then join over
    # the public internet with no firewall config). Requires cluster.discovery.
    kubespan:
      enabled: true
  # IP forwarding for the Tailscale subnet router (TS_ROUTES=192.168.40.0/24 in
  # tailscale.patch.yaml — the current Maine/tallman LAN). Tailscale advertises
  # the home LAN so off-LAN tailnet clients reach 192.168.40.111 (and the
  # Synology, etc.) with no cert-SAN/endpoint changes; forwarding lets the node
  # route to *other* LAN hosts. Host-level (machine.sysctls), not pod-level —
  # hostNetwork pods can't set sysctls.
  sysctls:
    net.ipv4.ip_forward: "1"
    net.ipv6.conf.all.forwarding: "1"
  # Extra cert SANs so kubectl/talosctl can reach the API by the node's Tailscale
  # identity or the stable LAN-DNS pointer, not just 192.168.40.111 — works from
  # any tailnet device with no subnet route, and survives the Maine move (the
  # tailnet name/IP and the LAN-DNS pointer are location-independent; the LAN IP
  # is not). machine.certSANs covers the Talos API (apid); cluster.apiServer.certSANs
  # (below) covers kube-apiserver. The IP is the current tailscale0 address; the
  # MagicDNS name and minipc.whereisdana.today are the stable anchors.
  # minipc.whereisdana.today is the same Route53 pointer the adanalife-rpi5
  # worker uses as its control-plane endpoint (see worker.patch.yaml).
  certSANs:
    - adanalife-minipc.tail020deb.ts.net
    - minipc.whereisdana.today
    - 100.71.27.106
  # Disk encryption DEFERRED (2026-05-20). TPM-sealed LUKS2 (systemDiskEncryption
  # with `tpm: {}`) requires a Talos SecureBoot image: it needs the PCR signing
  # key at /.extra/tpm2-pcr-public-key.pem, which only ships in SecureBoot
  # installers. On the standard image the STATE volume fails to format
  # ("failed to read pcr signing public key") and the node loops at "Installing"
  # — hit empirically on the first wipe. Re-add once we move to a SecureBoot
  # image + UEFI Secure Boot (+ key enrollment). Until then, at-rest protection
  # is physical security; the S3 postgres dump + the SOPS-stashed PKI are the
  # recovery path.

cluster:
  allowSchedulingOnControlPlanes: true
  # etcd serves /metrics on its client port by default, which on this cluster
  # means mTLS on 2379 — scrapeable only by something holding the etcd client
  # PKI, which nothing in the cluster does. `listen-metrics-urls` moves the
  # metrics (and /health) handler onto a second, plaintext listener that needs
  # no client certificate, so Alloy can scrape it as an ordinary target. This
  # is the only way to see etcd's fsync latency: nothing else reports it, and
  # etcd stalling past the 5s lease deadline is the standing suspect behind the
  # lockstep controller restarts (the `control-plane-health` alert group).
  #
  # 2381 carries no read or write API and no cluster data — the client (2379)
  # and peer (2380) listeners keep their mTLS untouched. It is reachable from
  # the LAN and the tailnet, which is the cost: a reader learns the cluster's
  # health and size, not its contents.
  #
  # NOT creation-time. Patching this on the running node restarts etcd, and on
  # a single-node control plane the API server is unavailable for those few
  # seconds — the same lockstep restart this exists to explain. Nothing in the
  # stream path depends on the control plane, so running pods keep serving.
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
  # Cilium owns the dataplane — Talos installs no CNI and no kube-proxy.
  network:
    cni:
      name: none
  proxy:
    disabled: true
  # Required by KubeSpan for peer discovery. Default-on in recent Talos; set
  # explicitly so the dependency is visible.
  discovery:
    enabled: true
  # kube-apiserver serving-cert SANs for Tailscale-native kubectl + the LAN-DNS
  # pointer (see machine.certSANs above). Lets
  # `server: https://adanalife-minipc.tail020deb.ts.net:6443` verify TLS from any
  # tailnet device, and — load-bearing — lets the adanalife-rpi5 worker's kubelet
  # verify the apiserver when it connects via https://minipc.whereisdana.today:6443.
  apiServer:
    certSANs:
      - adanalife-minipc.tail020deb.ts.net
      - minipc.whereisdana.today
      - 100.71.27.106
---
apiVersion: v1alpha1
kind: HostnameConfig
# auto must be overridden to "off" — the base controlplane.yaml ships
# `auto: stable`, and Talos rejects an auto-generating mode + a static
# hostname together. Quoted so YAML doesn't coerce `off` to boolean false.
auto: "off"
hostname: adanalife-minipc
---
apiVersion: v1alpha1
kind: UserVolumeConfig
# Durable data volume on the Samsung Portable SSD T5 (1.8T, USB), mounted at
# /var/mnt/data. local-path's backing dir (Postgres, NATS JetStream) lives here
# rather than the default under /var/lib: /var/lib sits on the Kingston NVMe's
# EPHEMERAL partition, which Talos WIPES on any control-plane reconfig/upgrade —
# the cause of the 2026-05-19 and 2026-06-15 prod-DB losses (the retain reclaim
# policy is irrelevant, the wipe is below the PV layer). A UserVolume is a
# SEPARATE physical disk with its own partition; Talos never wipes it on an
# apply-config/upgrade. The local-path-provisioner nodePathMap points at
# /var/mnt/data/local-path-provisioner (see k8s/local-path-provisioner/prod-1).
#
# Unlike KubeSpan/Cilium/Tailscale above, a UserVolume is NOT creation-time:
# Talos provisions (partitions + formats) the disk on the next config reconcile
# of the RUNNING node — no wipe-reinstall required. Provisioning FORMATS the
# selected disk, so anything already on it must be copied off first.
#
# USB caveat: the T5 is USB-attached (less bulletproof than an internal M.2 for
# an always-on DB volume). It's a strict improvement over the ephemeral
# partition; the long-term target is an internal PLP M.2, which this same config
# migrates to by re-pointing the diskSelector.
#
# diskSelector matches by transport+size: the T5 is the only USB disk and the
# only disk >1TB, so this can't accidentally select the ~950GB Kingston NVMe.
name: data
provisioning:
  diskSelector:
    match: disk.transport == 'usb' && disk.size > 1000u * GB
  # minSize is required by Talos; grow: true then expands the partition to fill
  # the whole ~1.8T disk (the T5 is dedicated to this one volume).
  minSize: 100GB
  grow: true
filesystem:
  type: xfs
# The global FilesystemTrimConfig below does not apply here. This disk is the
# Samsung T5 behind the usb-storage UAS quirk — it already drops off the bus
# under sustained write load, and discard traffic over that link is exactly the
# class of I/O the quirk exists to avoid. The internal NVMe gets its trims; this
# one does not.
trim:
  enabled: false
---
apiVersion: v1alpha1
kind: SecurityProfileConfig
# Runs CRI containerd, the kubelet, and every pod in a dedicated PID + mount
# namespace anchored by the sandboxd service, in its own least-privilege SELinux
# domain. If sandboxd dies the kernel tears the namespace down and Talos rebuilds
# it — relaunching CRI, the kubelet and the pods — without rebooting the node.
# Logs: `talosctl logs sandboxd`.
#
# The one thing isolation breaks is the deprecated in-tree Kubernetes iSCSI
# volume plugin: the kubelet can't reach the host iscsid across the sandbox PID
# boundary. This cluster has no iSCSI at all (local-path is the only
# provisioner), and iscsi-tools is not in the schematic. A future iSCSI need is
# served by a CSI node plugin, which does its own attach/mount in a privileged
# pod and is unaffected.
#
# Talos only emits this document for clusters generated on 1.14+; an upgraded
# cluster stays non-isolated until it is applied, so this is opt-in either way.
workloadIsolation: true
---
apiVersion: v1alpha1
kind: FilesystemTrimConfig
# Periodic fstrim of eligible volumes, so the Kingston NVMe keeps its write
# performance as the EPHEMERAL partition churns. Talos hashes a stable schedule
# per node and volume rather than trimming everything at once.
#
# Clusters generated on Talos 1.14+ ship this document by default; an upgraded
# cluster has no trimming until it is applied. The T5 UserVolume opts out above.
interval: 168h0m0s
