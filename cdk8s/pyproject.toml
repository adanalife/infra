[project]
name = "adanalife-k8s"
version = "0.1.0"
description = "cdk8s (Python) authoring layer for the adanalife Kubernetes deployments"
requires-python = ">=3.12"
dependencies = [
    "cdk8s>=2.70.89",
    "constructs>=10.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",  # a dist-reading test relies on it
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Synth-time tests only (unit + parity + contract): no cluster, so CI runs them
# offline. Live health is Argo's to report.
testpaths = ["tests/unit"]
pythonpath = ["."]
