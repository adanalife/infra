apiVersion: v1
kind: Namespace
metadata:
  name: arc-systems
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
  name: arc-runners
---
apiVersion: v1
kind: LimitRange
metadata:
  name: arc-runners-limits
  namespace: arc-runners
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 2Gi
      default:
        cpu: "2"
        memory: 3Gi
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
  namespace: arc-runners
spec:
  dataFrom:
    - extract:
        key: /k8s/arc/github-app
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameterstore-cluster
  target:
    name: arc-github-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tripbot-console-arc
  namespace: arc-runners
rules:
  - apiGroups:
      - actions.github.com
    resources:
      - autoscalingrunnersets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tripbot-console-arc
  namespace: arc-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tripbot-console-arc
subjects:
  - kind: ServiceAccount
    name: tripbot-console
    namespace: prod-1
  - kind: ServiceAccount
    name: tripbot-console
    namespace: stage-1
