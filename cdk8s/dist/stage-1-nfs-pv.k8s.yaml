apiVersion: v1
kind: PersistentVolume
metadata:
  name: vlc-dashcam-nfs-stage
spec:
  accessModes:
    - ReadOnlyMany
  capacity:
    storage: 1Ti
  mountOptions:
    - soft
    - timeo=150
    - retrans=3
  nfs:
    path: <export path>
    readOnly: true
    server: <NFS server address>
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
