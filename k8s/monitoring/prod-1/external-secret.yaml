# KEEP-IN-SYNC: k8s/monitoring/{development,prod-1}/external-secret.yaml
#
# ExternalSecret materializes the Grafana Cloud metrics/logs-write
# credentials into a k8s Secret in the monitoring namespace, sourced
# from SSM Parameter Store via the cluster-wide aws-parameterstore
# ClusterSecretStore.
#
# The remote SM value is JSON; dataFrom.extract pulls each top-level
# key (PROMETHEUS_HOST, PROMETHEUS_USERNAME, LOKI_HOST, LOKI_USERNAME,
# TOKEN) into a matching Secret key, so the helm chart can reference
# them from values.yml without enumerating each one here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud-metrics-write
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameterstore-cluster
    kind: ClusterSecretStore
  target:
    name: grafana-cloud-metrics-write
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /k8s/grafana-cloud-metrics-write
---
# The Grafana Cloud OTLP credential, for the cloudOtlp destination in
# values.yml. Only the monitoring namespace holds it: the apps export to
# the in-cluster Alloy receiver and carry no OTLP credential of their own.
# The remote value is JSON in the OTEL SDK env shape
# (OTEL_EXPORTER_OTLP_ENDPOINT, and OTEL_EXPORTER_OTLP_HEADERS as
# "Authorization=Basic <...>"). Alloy wants the endpoint and the bare header value, so the
# template splits the header into its own key here rather than carrying
# a second copy of the credential in Parameter Store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud-otlp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameterstore-cluster
    kind: ClusterSecretStore
  target:
    name: grafana-cloud-otlp
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OTLP_ENDPOINT: "{{ .OTEL_EXPORTER_OTLP_ENDPOINT }}"
        OTLP_AUTHORIZATION: '{{ .OTEL_EXPORTER_OTLP_HEADERS | trimPrefix "Authorization=" }}'
  dataFrom:
    - extract:
        key: /k8s/grafana-cloud-otlp
