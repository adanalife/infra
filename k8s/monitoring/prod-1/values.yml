# KEEP-IN-SYNC: k8s/monitoring/{development,prod-1}/values.yml
#
# Helm values for grafana/k8s-monitoring (chart v4.x). Ships the
# in-cluster collectors that fill the dashboards defined in
# terraform/stage-1/grafana-dashboards/:
#
#   - Alloy collectors → scrape pods + ship logs (via kube API) + cluster events
#   - kube-state-metrics → cluster/pod state metrics to Mimir
#   - kubelet + cAdvisor scrape (built into clusterMetrics)
#
# Host-level metrics (node-exporter) are installed separately into the
# `monitoring-host` namespace — Talos enforces PodSecurity baseline
# cluster-wide and node-exporter needs hostPath + hostNetwork, so it
# gets its own ns labeled `privileged`. This chart's workloads all stay
# under baseline.
#
# Credentials come from the grafana-cloud-metrics-write Secret in this
# namespace, materialized by the ExternalSecret in external-secret.yaml.
#
# Deltas from development/values.yml:
#   - cluster.name — labels the physical cluster (adanalife-minipc) in
#     Grafana Cloud dashboard filters. stage-1 and prod-1 co-tenant this
#     one mini-PC cluster and are separated by the `namespace` label
#     (which the chart attaches to every series) plus each workload's
#     deployment.environment OTEL attribute — NOT by cluster.
#   - clusterMetrics / hostMetrics / annotationAutodiscovery are off in
#     development (logs + cluster events only). Here they're on for
#     prod-1, fanned out to two metrics destinations: Grafana Cloud
#     (capped free tier — cap-driven drops applied per-destination) and
#     the in-cluster VictoriaMetrics (full fidelity, no drops).

cluster:
  name: adanalife-minipc

destinations:
  metrics:
    type: prometheus
    # PROMETHEUS_HOST in SM already includes the /api/prom path
    # (Grafana Cloud's "Prometheus" connection URL form). Only the
    # /push suffix needs adding.
    urlFrom: convert.nonsensitive(remote.kubernetes.secret.metrics.data["PROMETHEUS_HOST"]) + "/push"
    auth:
      type: basic
      usernameKey: PROMETHEUS_USERNAME
      passwordKey: TOKEN
    secret:
      create: false
      name: grafana-cloud-metrics-write
      namespace: monitoring
    # Cloud allowlist. This destination's remote_write feeds Grafana
    # Cloud's capped free tier (15K active-series hard cap); localMetrics
    # (VictoriaMetrics) receives the full scrape unfiltered, so anything
    # dropped here stays queryable there. OTLP-push app metrics
    # (tripbot/obs/playout/onscreens) bypass this pipeline entirely — they
    # push straight to the cloud OTLP endpoint — so the cloud holds all of
    # those regardless of these rules.
    #
    # The keep rule is an allowlist: it ships only the scraped series that
    # cloud alerts and dashboards depend on, and drops every other scraped
    # series from the cloud. Kept families:
    #   platform_gateway_*  — service-health-platform-gateway dashboard +
    #                         the gateway-health alert (platform_gateway_up).
    #   paths* / rtsp_sessions*  — mediamtx relay; the
    #                         stream-health-playout-to-mediamtx dashboard +
    #                         the relay-health alerts.
    #   kube_pod_{info,start_time,container_status_restarts_total}  — the
    #                         per-service pod-health rows on service-health-*.
    #   xpum_*              — the igpu-performance dashboard. ~9 series for
    #                         the shared-encoder contention view; the iGPU is
    #                         the scarcest resource on the minipc, so this one
    #                         earns cloud residency despite being scraped.
    #   burrito_terraform_layer_status  — terraform drift per layer, for the
    #                         drift alert. One series per layer (the gauge
    #                         deletes the other status labels), so four today.
    #   burrito_runs_by_status  — one series per distinct run status, and the
    #                         only series that moves while Burrito is wedged
    #                         mid-run: the layer gauge keeps reporting the last
    #                         COMPLETED plan's status, and runs_failed_total is
    #                         a counter that stays absent until retries are
    #                         exhausted. Feeds the runs-stuck-retrying alert.
    #                         Burrito's other families (the rest of runs,
    #                         reconcile, its controller-runtime self-metrics)
    #                         stay local-VM-only.
    # Everything else scraped is local-VM-only: node_* (node-exporter-full),
    # container_*/machine_* (cadvisor), the rest of kube_* (kubernetes-views),
    # cilium_*, traefik_*, coredns_*, certmanager_*, external(_)dns_*,
    # externalsecret_*, windows_*. Those dashboards need a VictoriaMetrics
    # datasource in Grafana Cloud, which does not exist yet (it needs the PDC
    # agent) — until it does, query VM by port-forward. Only two
    # scraped series feed any alert — paths and platform_gateway_up — and both
    # are kept, so no alert goes blind.
    metricProcessingRules: |-
      write_relabel_config {
        // The one stage-1 exception, and it needs the marker below because RE2
        // has no negative lookahead: mark what to spare first, then drop the
        // stage-1 series that carry no mark.
        //
        // guessr's round-generation CronJob lives in stage-1 because it writes
        // staging's D1, but it is the only thing standing between the game and
        // a day with no rounds on it, and nothing else can see whether it ran.
        //
        // Scoped by metric rather than by CronJob, so it covers every stage-1
        // CronJob (guessr-rounds and dashcam-cv-fill today) at two series each
        // against a 15000-series cap. That makes the next batch alert free
        // rather than another edit here, and the cost stays negligible because
        // the family is one series per CronJob per metric — it does not scale
        // with runs, pods or history.
        source_labels = ["namespace", "__name__"]
        separator = "/"
        regex = "stage-1/kube_cronjob_(status_last_successful_time|created)"
        target_label = "__tmp_cloud_keep"
        replacement = "yes"
        action = "replace"
      }
      write_relabel_config {
        // stage-1 namespaces never ship to the cloud — prod-1 only from
        // this shared cluster. Runs before the keep-list: a stage-1 series
        // whose name is on the allowlist (e.g. a stage mediamtx `paths`)
        // would otherwise slip through. stage-1 logs + events still ship
        // (Loki, not Mimir); stage-1 metrics land in localMetrics.
        //
        // An unmarked stage-1 series joins to "stage-1/" and matches, because
        // these regexes are fully anchored; a marked one joins to "stage-1/yes"
        // and survives.
        source_labels = ["namespace", "__tmp_cloud_keep"]
        separator = "/"
        regex = "stage-1(-platform)?/"
        action = "drop"
      }
      write_relabel_config {
        // Drop the marker rather than trusting remote-write to strip __-prefixed
        // labels for us. One rule, one less assumption.
        regex = "__tmp_cloud_keep"
        action = "labeldrop"
      }
      write_relabel_config {
        // The allowlist. `keep` drops every scraped series whose __name__
        // isn't matched (regexes are fully anchored, RE2). Add a family
        // only when a cloud dashboard or alert queries it — the default
        // answer for a new scraped metric is local-VM-only.
        //
        // Matched against __name__ + mountpoint so the T5 fill alert
        // (host-storage rule group) can have its two inputs without the
        // whole node_filesystem_* family: node-exporter emits those per
        // mount, and only /var/mnt/data is worth cloud residency. Every
        // other kept family is mountpoint-less, so it joins to a bare
        // trailing separator — which is what the "/" at the end of the
        // first alternative matches, and what a new family must keep.
        source_labels = ["__name__", "mountpoint"]
        separator = "/"
        regex = "(platform_gateway_.+|paths(_.+)?|rtsp_sessions(_.+)?|kube_pod_info|kube_pod_start_time|kube_pod_container_status_restarts_total|xpum_.+|kube_cronjob_status_last_successful_time|kube_cronjob_created|burrito_terraform_layer_status|burrito_runs_by_status)/|node_filesystem_(avail|size)_bytes//var/mnt/data"
        action = "keep"
      }

  localMetrics:
    type: prometheus
    # In-cluster VictoriaMetrics — the full-fidelity, no-cap store
    # (see k8s/monitoring/victoria-metrics/). Receives everything the
    # collectors scrape, including the stage-1 and launch-day-trim
    # series the cloud destination drops.
    url: http://victoria-metrics.monitoring.svc.cluster.local:8428/api/v1/write

  logs:
    type: loki
    urlFrom: convert.nonsensitive(remote.kubernetes.secret.logs.data["LOKI_HOST"]) + "/loki/api/v1/push"
    auth:
      type: basic
      usernameKey: LOKI_USERNAME
      passwordKey: TOKEN
    secret:
      create: false
      name: grafana-cloud-metrics-write
      namespace: monitoring

clusterMetrics:
  enabled: true
  collector: alloy-metrics
  cadvisor:
    metricsTuning:
      includeMetrics:
        - container_cpu_cfs_throttled_seconds_total
        - container_oom_events_total
        - container_network_receive_errors_total
        - container_network_transmit_errors_total
    # Drop high-cardinality identifier labels that change on every container
    # restart (container_id) or are duplicates of pod/container (id, image_id).
    # Mimir merges series that differ only by dropped labels — saves the
    # restart-churn cardinality. Source-level: no destination wants these.
    extraMetricProcessingRules: |-
      rule {
        action = "labeldrop"
        regex = "id|container_id|image_id"
      }
  kube-state-metrics:
    metricsTuning:
      includeMetrics:
        - kube_pod_container_status_last_terminated_exitcode
        - kube_pod_status_scheduled
        - kube_namespace_created
        # CronJob liveness, for the batch-health alert. The chart's default
        # allowlist carries no kube_cronjob_* at all, so these are absent from
        # BOTH destinations until named here — the cloud drop-list is a separate
        # question, handled in the destination's rules above. `created` is the
        # floor the alert measures from before a CronJob has ever succeeded;
        # without it a brand-new CronJob that has never run reads as no-data
        # rather than as overdue. Cluster-wide these are two series per CronJob.
        - kube_cronjob_status_last_successful_time
        - kube_cronjob_created
      # Both overlap with cheaper metrics already in the default allowlist:
      # kube_pod_status_reason (~210 series) overlaps with kube_pod_status_phase;
      # kube_deployment_status_condition (~144 series) is rarely queried directly
      # vs. the cluster-overview dashboards that use kube_deployment_status_replicas_*.
      excludeMetrics:
        - kube_pod_status_reason
        - kube_deployment_status_condition
        # ReplicaSet metrics: ~2100 series (9 metrics × ~236 RSes — every
        # Deployment keeps 10 revisions of history), zero dashboard/alert
        # references; workload state is charted via kube_deployment_*.
        - kube_replicaset_created
        - kube_replicaset_metadata_generation
        - kube_replicaset_owner
        - kube_replicaset_spec_replicas
        - kube_replicaset_status_fully_labeled_replicas
        - kube_replicaset_status_observed_generation
        - kube_replicaset_status_ready_replicas
        - kube_replicaset_status_replicas
        - kube_replicaset_status_terminating_replicas
        # Per-secret resource-version gauge (~230 series), unreferenced
        # (kube_secret_info, which the global view uses, stays).
        - kube_secret_metadata_resource_version
        # Neither is referenced by any dashboard or alert (~270 series
        # combined): completion_time is a per-finished-pod timestamp,
        # restart_policy is a static per-pod constant.
        - kube_pod_completion_time
        - kube_pod_restart_policy
    # Drop pod UID — changes on every pod rebuild and creates a fresh series
    # set each rollout. Dashboards query by pod name, not uid.
    extraMetricProcessingRules: |-
      rule {
        action = "labeldrop"
        regex = "uid"
      }

hostMetrics:
  enabled: true
  collector: alloy-metrics
  linuxHosts:
    enabled: true
    # Point hostMetrics at the externally-deployed node-exporter
    # (prometheus-community chart in the `monitoring-host` namespace
    # — see k8s/monitoring/node-exporter/). Without these, the chart
    # refuses to render: "The Linux host configuration requires a
    # connection to Node Exporter". The default would scrape the
    # chart's bundled node-exporter (which we disabled to keep this
    # namespace under baseline PSA).
    namespace: monitoring-host
    labelMatchers:
      app.kubernetes.io/name: prometheus-node-exporter
    metricsTuning:
      useIntegrationAllowList: true

clusterEvents:
  enabled: true
  collector: alloy-singleton

# Pod logs via the Kubernetes API instead of tailing /var/log on the
# host. Trade-off: a tiny bit slower than reading log files directly,
# but doesn't require hostPath (and therefore namespace-privileged PSA).
# Keeps every collector under PodSecurity baseline.
podLogsViaKubernetesApi:
  enabled: true
  collector: alloy-logs

annotationAutodiscovery:
  enabled: true
  collector: alloy-metrics
  # Override the chart's default annotation keys (k8s.grafana.com/*)
  # to the standard prometheus.io/* convention used by upstream charts
  # (traefik, external-dns, cert-manager, external-secrets,
  # prometheus-community/prometheus-node-exporter, and almost any
  # future scrape target we'd add).
  annotations:
    scrape: "prometheus.io/scrape"
    metricsPath: "prometheus.io/path"
    metricsPortNumber: "prometheus.io/port"
    metricsScheme: "prometheus.io/scheme"
  # Cardinality controls (Alloy River syntax). Applied to every series
  # scraped via annotation-autodiscovery — covers Cilium, traefik, ESO,
  # cert-manager, external-dns, node-exporter, and any future prometheus.io-
  # annotated pod. Rules execute top-to-bottom; first matching action wins.
  # Source-level rules run before the destination fan-out, so everything
  # dropped here is gone from Grafana Cloud AND the local VictoriaMetrics —
  # only zero-signal noise belongs in this list. Cap-driven trims live on
  # the cloud destination's metricProcessingRules instead.
  extraMetricProcessingRules: |-
    rule {
      // Drop Cilium's internal scheduler / k8s-client histograms — high
      // cardinality (~700 series combined), zero operational signal for
      // adanalife. Network/policy/endpoint counters are preserved.
      source_labels = ["__name__"]
      regex = "cilium_hive_jobs_.+|cilium_identity_updater_timer_.+|cilium_k8s_workqueue_.+_bucket|cilium_k8s_client_api_latency_.+_bucket|cilium_act_processing_time_seconds_bucket"
      action = "drop"
    }
    rule {
      // Drop _bucket suffix on controller_runtime + workqueue histograms
      // (cert-manager / ESO / external-dns reconcile loops). We don't
      // chart p99 latency on these — _count and _sum are kept so rate
      // and average panels still work. ~500 series.
      source_labels = ["__name__"]
      regex = "controller_runtime_reconcile_time_seconds_bucket|workqueue_(queue|work|unfinished_work|longest_running_processor)_duration_seconds_bucket"
      action = "drop"
    }
    rule {
      // Drop rollout-churn labels from annotation-scraped series. Both
      // change on every Deployment/DaemonSet rev, so without this each
      // rollout doubles the active series for ~20min (Mimir lookback).
      action = "labeldrop"
      regex = "pod_template_hash|controller_revision_hash"
    }
    rule {
      // MediaMTX rtsp_conns_* carry a UUID `id` label that churns on
      // every reconnect — cardinality-toxic and nothing charts them
      // (paths_* / rtsp_sessions_* feed the stream-health dashboard).
      // Source-level: no destination wants a per-reconnect series set.
      source_labels = ["__name__"]
      regex = "rtsp_conns.*"
      action = "drop"
    }
    // No xpum_* drop rule. intel/xpumanager on the Iris Xe emits exactly four
    // families — xpum_per_engine_ratio, xpum_frequency_mhz,
    // xpum_topology_link, xpum_xelink_port_status — and the first two are the
    // only ones carrying utilization signal, so dropping them leaves nothing
    // to chart. xpum_per_engine_ratio does emit each (engine_id, type) series
    // twice per scrape, which Alloy logs as "Error on ingesting samples with
    // different value but same timestamp" before discarding the duplicate;
    // that log line is the price of the iGPU contention view. ~9 series.

telemetryServices:
  kube-state-metrics:
    deploy: true
  # node-exporter deploys separately into the `monitoring-host`
  # namespace via the prometheus-community/prometheus-node-exporter
  # chart — see Taskfile k8s:prod:platform:up. It's the only workload
  # we run that genuinely needs hostPath + hostNetwork; isolating it
  # in its own privileged-labeled namespace keeps the rest of
  # `monitoring` under baseline.
  node-exporter:
    deploy: false

collectors:
  alloy-metrics:
    presets: [clustered, statefulset]
  alloy-logs:
    # `clustered` lets replicas partition pods between themselves so
    # podLogsViaKubernetesApi doesn't N-multiply kube-API log fetches.
    # `daemonset` keeps one collector per node for locality.
    presets: [clustered, daemonset]
  alloy-singleton:
    presets: [singleton]

# `collectorCommon.alloy` passes through to the underlying grafana/alloy
# subchart, which uses two distinct securityContext keys (the doubled
# `alloy.alloy` path is the container-level block — load-bearing for
# PSA, which reads capabilities from there).
#
# The chart's container default re-adds the full Docker capability set
# after dropping ALL, including NET_RAW — which is what fails Talos's
# baseline PSA enforcement. Alloy needs none of those caps for HTTP
# scrape + push, so we wipe the add list entirely. `add: []` is
# required explicitly because helm deep-merges the capabilities map
# (omitting `add` would inherit the chart default).
collectorCommon:
  alloy:
    securityContext:
      runAsNonRoot: true
      runAsUser: 4242
      seccompProfile:
        type: RuntimeDefault
    alloy:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          add: []
          drop: [ALL]
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 4242
        seccompProfile:
          type: RuntimeDefault
      # Writable working dir for alloy's storagePath (default
      # /tmp/alloy) — needed because readOnlyRootFilesystem locks /.
      mounts:
        extra:
          - name: tmp-alloy
            mountPath: /tmp/alloy
    controller:
      volumes:
        extra:
          - name: tmp-alloy
            emptyDir: {}
